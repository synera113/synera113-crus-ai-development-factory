services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crus
      POSTGRES_USER: crus
      POSTGRES_PASSWORD: crus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crus -d crus"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      CRUS_MODE: demo
      CRUS_DATABASE_URL: postgresql+psycopg://crus:crus@postgres:5432/crus
      CRUS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
